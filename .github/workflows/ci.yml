name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nog niet blokkerend: er staan ~120 bestaande lint-errors open (85 in
      # scripts/). Zodra die zijn opgeruimd deze regel weghalen.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          # Build runs without a real DB; lib/db only warns, pages are force-dynamic.
          NEXT_TELEMETRY_DISABLED: "1"
