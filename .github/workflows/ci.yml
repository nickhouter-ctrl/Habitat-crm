name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nog niet blokkerend: er staan ~120 bestaande lint-errors open (85 in
      # scripts/). Zodra die zijn opgeruimd deze regel weghalen.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          # Build runs without a real DB; lib/db only warns, pages are force-dynamic.
          NEXT_TELEMETRY_DISABLED: "1"
